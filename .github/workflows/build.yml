name: build

# Todo push pro master compila os artefatos do monorepo:
#   client-pc  → Windows (NSIS + MSI + portable) e Linux x64/arm64 (AppImage + .deb)
#   server     → imagem Docker multi-arch publicada no ghcr.io
# Tudo sai como artifact da run — nenhum GitHub Release é criado automaticamente.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  client-pc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            librclone_dir: x86_64-pc-windows-gnu
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            librclone_dir: x86_64-unknown-linux-gnu
          # Runners ARM hospedados pelo GitHub (grátis pra repo público desde jan/2025).
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            librclone_dir: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # SHA curto (7 chars) → entra no nome do artifact pra distinguir runs.
      # Sem isso, downloads de runs diferentes colidem na pasta local.
      - name: short sha
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # O script do librclone precisa de gcc + go. Ubuntu tem os dois; os
      # runners Windows trazem MSYS2 mas sem mingw no PATH.
      - name: add mingw to PATH (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: install linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            xdg-utils

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Cache do librclone produzido (~50 MB). Só rebuilda quando o script muda.
      - name: cache librclone
        id: cache-librclone
        uses: actions/cache@v4
        with:
          path: vendor/librclone
          key: librclone-v2-${{ matrix.target }}-${{ hashFiles('scripts/build-librclone.sh') }}

      - name: build librclone
        if: steps.cache-librclone.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-librclone.sh

      - name: npm ci
        run: npm ci

      - name: tauri build
        shell: bash
        working-directory: apps/client-pc
        run: npx tauri build --target ${{ matrix.target }}

      # O Tauri gera os instaladores (msi/nsis no win, appimage/deb no linux).
      # No Windows a gente também quer um portable — só o .exe + a dll, sem
      # instalador (WebView2 já vem no Win11).
      - name: package windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $portable = "save-sync-portable-windows-x64"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/save-sync.exe $portable/
          Copy-Item target/${{ matrix.target }}/release/librclone.dll $portable/
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -Force

      # Junta só o que deve ser publicado (descarta build intermediário, rpm etc).
      # Os globs são nullglob-safe: padrão sem match não quebra o job.
      - name: collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in \
            target/${{ matrix.target }}/release/bundle/msi/*.msi \
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe \
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            target/${{ matrix.target }}/release/bundle/deb/*.deb \
            save-sync-portable-*.zip
          do
            cp "$f" dist/
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: save-sync-${{ matrix.label }}-${{ steps.sha.outputs.short }}
          path: dist/*
          if-no-files-found: warn


  # ─── imagem do server ─────────────────────────────────────────────────
  #
  # Uma imagem por arquitetura, buildada no runner nativo, empurrada por
  # digest; um job final junta as duas num manifesto multi-arch. É o padrão
  # da documentação do buildx, e existe por um motivo prático: compilar Rust
  # sob emulação QEMU leva dezenas de minutos, enquanto nativo leva três.
  #
  # O Dockerfile não compila nada — só empacota o que o job já produziu.
  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: amd64
            librclone_dir: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            arch: arm64
            librclone_dir: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # Não há go.sum no repo — o Go só é usado pelo script do
          # librclone, que compila fora da árvore. Sem isto a action loga um
          # aviso de cache toda run.
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # O server carrega o librclone em runtime pro backup off-site, então a
      # imagem precisa do .so — mesmo artefato que o client usa.
      - name: cache librclone
        id: cache-librclone
        uses: actions/cache@v4
        with:
          path: vendor/librclone
          key: librclone-v2-${{ matrix.librclone_dir }}-${{ hashFiles('scripts/build-librclone.sh') }}

      - name: build librclone
        if: steps.cache-librclone.outputs.cache-hit != 'true'
        run: bash scripts/build-librclone.sh

      - name: npm ci
        run: npm ci

      - name: build web ui
        run: npm run build

      - name: build server
        run: cargo build --release -p save-sync-server

      - name: assemble docker context
        run: |
          mkdir -p dist
          cp target/release/save-sync-server dist/
          cp vendor/librclone/${{ matrix.librclone_dir }}/librclone.so dist/
          cp -r apps/web/build dist/web
          cp docker/Dockerfile dist/
          ls -la dist/

      # ghcr exige o nome do repositório em minúsculas; o do GitHub não é.
      - name: image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build e push por digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: dist/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      # O manifesto é montado no job seguinte, que precisa saber os digests.
      # A remoção do prefixo `sha256:` acontece no bash: expressão do GitHub
      # não faz substring desse jeito.
      - name: exporta digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

      # Tarball pra quem preferir carregar direto no NAS sem passar pelo
      # registry (`docker load < ...`). Só no arm64, que é o alvo do DH4300.
      - name: tarball offline (arm64)
        if: matrix.arch == 'arm64'
        run: |
          docker buildx build --platform linux/arm64 --load \
            -t save-sync-server:${{ github.sha }} -f dist/Dockerfile dist
          docker save save-sync-server:${{ github.sha }} \
            | gzip > save-sync-server-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: save-sync-server-arm64-tarball
          path: save-sync-server-arm64.tar.gz
          if-no-files-found: error

  # Junta as imagens por arquitetura num manifesto só, pra que
  # `docker pull ghcr.io/<repo>:latest` funcione tanto no NAS arm64 quanto
  # num PC amd64 sem ninguém escolher tag.
  server-manifest:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: short sha
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: cria o manifesto
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ steps.img.outputs.name }}:latest \
            -t ${{ steps.img.outputs.name }}:${{ steps.sha.outputs.short }} \
            $(printf '${{ steps.img.outputs.name }}@sha256:%s ' *)

      - name: confere o resultado
        run: docker buildx imagetools inspect ${{ steps.img.outputs.name }}:latest
