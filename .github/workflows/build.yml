name: build

# Todo push pro master compila os artefatos do monorepo:
#   client-pc  → Windows (NSIS + MSI + portable) e Linux x64/arm64 (AppImage + .deb)
#   server     → imagem Docker arm64 pro NAS
# Tudo sai como artifact da run — nenhum GitHub Release é criado automaticamente.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  client-pc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            librclone_dir: x86_64-pc-windows-gnu
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            librclone_dir: x86_64-unknown-linux-gnu
          # Runners ARM hospedados pelo GitHub (grátis pra repo público desde jan/2025).
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            librclone_dir: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # SHA curto (7 chars) → entra no nome do artifact pra distinguir runs.
      # Sem isso, downloads de runs diferentes colidem na pasta local.
      - name: short sha
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # O script do librclone precisa de gcc + go. Ubuntu tem os dois; os
      # runners Windows trazem MSYS2 mas sem mingw no PATH.
      - name: add mingw to PATH (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: install linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            xdg-utils

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Cache do librclone produzido (~50 MB). Só rebuilda quando o script muda.
      - name: cache librclone
        id: cache-librclone
        uses: actions/cache@v4
        with:
          path: vendor/librclone
          key: librclone-v2-${{ matrix.target }}-${{ hashFiles('scripts/build-librclone.sh') }}

      - name: build librclone
        if: steps.cache-librclone.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-librclone.sh

      - name: npm ci
        run: npm ci

      - name: tauri build
        shell: bash
        working-directory: apps/client-pc
        run: npx tauri build --target ${{ matrix.target }}

      # O Tauri gera os instaladores (msi/nsis no win, appimage/deb no linux).
      # No Windows a gente também quer um portable — só o .exe + a dll, sem
      # instalador (WebView2 já vem no Win11).
      - name: package windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $portable = "save-sync-portable-windows-x64"
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/save-sync.exe $portable/
          Copy-Item target/${{ matrix.target }}/release/librclone.dll $portable/
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -Force

      # Junta só o que deve ser publicado (descarta build intermediário, rpm etc).
      # Os globs são nullglob-safe: padrão sem match não quebra o job.
      - name: collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in \
            target/${{ matrix.target }}/release/bundle/msi/*.msi \
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe \
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            target/${{ matrix.target }}/release/bundle/deb/*.deb \
            save-sync-portable-*.zip
          do
            cp "$f" dist/
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: save-sync-${{ matrix.label }}-${{ steps.sha.outputs.short }}
          path: dist/*
          if-no-files-found: warn

  server:
    # Runner arm64 nativo: o NAS é RK3588. Compilar Rust sob QEMU levaria
    # dezenas de minutos, então a imagem só empacota o que é buildado aqui.
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: short sha
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # O server carrega o librclone em runtime pro backup off-site, então a
      # imagem precisa do .so — mesmo artefato que o client usa.
      - name: cache librclone
        id: cache-librclone
        uses: actions/cache@v4
        with:
          path: vendor/librclone
          key: librclone-v2-aarch64-unknown-linux-gnu-${{ hashFiles('scripts/build-librclone.sh') }}

      - name: build librclone
        if: steps.cache-librclone.outputs.cache-hit != 'true'
        run: bash scripts/build-librclone.sh

      - name: npm ci
        run: npm ci

      - name: build web ui
        run: npm run build

      - name: build server
        run: cargo build --release -p save-sync-server

      - name: assemble docker context
        run: |
          mkdir -p dist
          cp target/release/save-sync-server dist/
          cp vendor/librclone/aarch64-unknown-linux-gnu/librclone.so dist/
          cp -r apps/web/build dist/web
          ls -la dist/

      - name: build image
        run: |
          docker build -f docker/Dockerfile -t save-sync-server:${{ steps.sha.outputs.short }} dist/
          docker save save-sync-server:${{ steps.sha.outputs.short }} \
            | gzip > save-sync-server-arm64-${{ steps.sha.outputs.short }}.tar.gz
          ls -lh save-sync-server-arm64-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: save-sync-server-arm64-${{ steps.sha.outputs.short }}
          path: save-sync-server-arm64-*.tar.gz
          if-no-files-found: error
