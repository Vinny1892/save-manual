[package]
name = "save-sync"
description = "Client de PC do save-sync — UI Tauri + agente local (watcher, proc-watch, motor de sync)."
authors = ["Vinicius Espindola"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# O sufixo `_lib` parece redundante mas evita colisão com o nome do bin no
# Windows — ver https://github.com/rust-lang/cargo/issues/8519
name = "save_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
save-sync-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
notify.workspace = true
sysinfo.workspace = true
image.workspace = true
urlencoding.workspace = true
