[workspace]
resolver = "2"
members = [
  "crates/core",
  "apps/client-pc/src-tauri",
  "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Versões centralizadas: os três crates puxam daqui via `.workspace = true`,
# então core/server/client nunca divergem de versão de uma dep compartilhada.
[workspace.dependencies]
save-sync-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "7"
fs_extra = "1"
dirs = "6"
libloading = "0.8"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
urlencoding = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tempfile = "3"
